<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Без подписки — бесплатные программы</title>
<meta name="description" content="Бесплатные замены платным программам для Mac и Windows. Без рекламы и слежки.">
<link rel="icon" href="icons/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B12; --card: #15161F; --line: rgba(255,255,255,.08); --text: #fff; --muted: rgba(255,255,255,.6);
    --grad: linear-gradient(135deg, #FFB547 0%, #FF4F8B 45%, #7B5CFF 100%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, -apple-system, "Segoe UI", sans-serif;
         background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
         background-size: 40px 40px; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 48px 20px 64px; }
  header { display: flex; align-items: center; gap: 20px; margin-bottom: 12px; }
  .logo { flex: none; width: 76px; height: 76px; border-radius: 50%; padding: 4px; background: var(--grad); }
  .logo div { width: 100%; height: 100%; border-radius: 50%; background: var(--bg); display: grid; place-items: center;
              font-weight: 900; font-size: 26px; letter-spacing: 3px; }
  .logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
  .sub { margin: 4px 0 0; color: var(--muted); font-weight: 500; }
  .phone { display: none; margin: 24px 0 0; padding: 14px 16px; border-radius: 14px; background: #1E1A2E;
           border: 1px solid rgba(123,92,255,.4); font-size: 15px; }
  .phone b { color: #B9A8FF; }
  .grid { display: grid; gap: 18px; margin-top: 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 24px; }
  .top { display: flex; gap: 16px; align-items: center; }
  .top img { width: 64px; height: 64px; border-radius: 16px; }
  .top h2 { margin: 0; font-size: 26px; font-weight: 800; }
  .top p { margin: 0; color: var(--muted); font-weight: 500; }
  .about { margin: 16px 0 6px; }
  .repl { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: transparent; color: var(--text); padding: 8px 14px;
                 border-radius: 999px; font: 600 14px Inter, sans-serif; cursor: pointer; }
  .tabs button.on { background: #fff; color: #0B0B12; border-color: #fff; }
  .how { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
  .cmd { display: flex; align-items: stretch; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #0E0F16; }
  .cmd code { flex: 1; padding: 14px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; color: #E8E8F0; }
  .cmd button { flex: none; border: 0; padding: 0 18px; font: 700 14px Inter, sans-serif; cursor: pointer; color: #0B0B12; background: var(--grad); }
  .more { display: inline-block; margin-top: 14px; font-size: 14px; color: var(--muted); text-decoration: none; }
  .more:hover { color: #fff; }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 14px; }
  footer a { color: #fff; font-weight: 700; text-decoration: none; }
  @media (max-width: 600px) { .wrap { padding-top: 28px; } .card { padding: 18px; } .top img { width: 52px; height: 52px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div><span>0₽</span></div></div>
    <div>
      <h1>Без подписки</h1>
      <p class="sub">Бесплатные замены платным программам для Mac и Windows</p>
    </div>
  </header>

  <div class="phone" id="phone">
    📱 Это программы для <b>компьютера</b>. Открой эту страницу на Mac или Windows — адрес <b>pavelb-22.github.io</b> — и выбери программу.
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    Новые программы и обновления — в Telegram-канале
    <a href="https://t.me/+CKC03YLzAaU3ZGI6">«Без подписки»</a><br>
    Вопросы и идеи: <a href="https://t.me/nybzik1">@nybzik1</a>
  </footer>
</div>

<script>
  const ua = navigator.userAgent;
  const isMobile = /iPhone|iPad|Android/i.test(ua);
  const isWin = /Windows/i.test(ua);
  if (isMobile) document.getElementById('phone').style.display = 'block';

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function card(p) {
    const keys = Object.keys(p.platforms);
    const first = isWin && keys.includes('windows') ? 'windows' : keys[0];
    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = `
      <div class="top"><img src="${p.icon}" alt=""><div><h2>${esc(p.name)}</h2><p>${esc(p.tagline)}</p></div></div>
      <p class="about">${esc(p.about)}</p>
      ${p.replaces ? `<p class="repl">Бесплатная замена: ${esc(p.replaces)}</p>` : ''}
      <div class="tabs">${keys.map((k) => `<button data-k="${k}">${k === 'mac' ? '🍏 ' : '🪟 '}${esc(p.platforms[k].label)}</button>`).join('')}</div>
      <p class="how"></p>
      <div class="cmd"><code></code><button>Копировать</button></div>
      <a class="more" href="${p.repo}" target="_blank" rel="noopener">Исходный код на GitHub →</a>`;
    const show = (k) => {
      el.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.k === k));
      el.querySelector('.how').textContent = p.platforms[k].how;
      el.querySelector('code').textContent = p.platforms[k].cmd;
    };
    el.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => show(b.dataset.k)));
    const copyBtn = el.querySelector('.cmd button');
    copyBtn.onclick = async () => {
      const text = el.querySelector('code').textContent;
      try { await navigator.clipboard.writeText(text); }
      catch { const r = document.createRange(); r.selectNodeContents(el.querySelector('code'));
              const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); }
      copyBtn.textContent = 'Скопировано ✓';
      setTimeout(() => (copyBtn.textContent = 'Копировать'), 1800);
    };
    show(first);
    return el;
  }

  fetch('programs.json', { cache: 'no-store' })
    .then((r) => r.json())
    .then((list) => list.forEach((p) => document.getElementById('grid').appendChild(card(p))))
    .catch(() => (document.getElementById('grid').textContent = 'Не удалось загрузить список. Обнови страницу.'));
</script>
</body>
</html>
